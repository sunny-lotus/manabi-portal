<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>はなまるチームチャレンジ</title>
<style>
:root{
  --navy:#141a46; --navy2:#232b6b; --ink:#fff; --sub:#c9d0ff; --gold:#ffd23f; --gold-d:#d99a00;
  --pink:#ff4f9a; --cyan:#2fd6ff; --lime:#7be34a; --ok:#35d07f; --ng:#ff5a5a;
  --m1:#ff5a5a; --m2:#3d9bff; --m3:#35c56f; --m4:#ffb020; --m5:#b06bff; --m6:#ff7ac6;
  --font:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --round:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0f2e}
body{font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#cv-probe{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:-1}
#cv-box{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:#0b0f2e}
#cv-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;user-select:none}
#cv-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;overscroll-behavior:contain}
#cv-ver{position:absolute;right:8px;bottom:5px;z-index:2;font-size:11px;color:rgba(201,208,255,.75);pointer-events:none}
#cv-box:not(.home) #cv-ver{display:none}
#cv-toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;max-width:calc(100% - 32px);background:#fff;color:#141a46;border:3px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:700;pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px 28px}
.screen[hidden]{display:none!important}

/* ===== 共通 ===== */
.panel{position:relative;background:linear-gradient(160deg,rgba(35,43,107,.94),rgba(20,26,70,.96));border:3px solid rgba(255,210,63,.7);border-radius:22px;box-shadow:0 0 0 4px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.5);padding:clamp(16px,3vw,28px)}
.big{font-family:var(--round);font-weight:900;font-size:clamp(18px,2.6vw,22px);color:#3a2600;background:linear-gradient(#ffe680,#ffc21a);border:0;border-radius:999px;padding:12px 30px;box-shadow:0 6px 0 #b37a00,0 10px 20px rgba(0,0,0,.35);transition:transform .1s,filter .1s}
.big:hover{filter:brightness(1.07);transform:translateY(-2px)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b37a00}
.big.sub{color:#fff;background:linear-gradient(#4a55b8,#2d3584);box-shadow:0 6px 0 #1a2060}
.chip{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;font-weight:900;font-size:15px}
.chip:hover{background:rgba(255,255,255,.2)}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.topbar .sp{flex:1}
.mb{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;height:2.2em;border-radius:999px;font-weight:900;color:#fff;padding:0 .6em;box-shadow:0 3px 0 rgba(0,0,0,.3);white-space:nowrap}
.m1{background:var(--m1)}.m2{background:var(--m2)}.m3{background:var(--m3)}.m4{background:var(--m4)}.m5{background:var(--m5)}.m6{background:var(--m6)}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ===== クッション ===== */
#cushion{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo-big .en{display:block;font-weight:900;letter-spacing:.35em;color:var(--cyan);font-size:clamp(12px,2vw,16px)}
.logo-big .ja{display:block;font-family:var(--round);font-weight:900;font-size:clamp(34px,7.4vw,70px);line-height:1.1;color:#fff;text-shadow:0 0 18px rgba(255,210,63,.8),0 5px 0 #c27b00,0 10px 24px rgba(0,0,0,.5)}
.logo-big .ja em{font-style:normal;color:var(--gold)}
#cushion img{width:min(170px,30vw);border-radius:50%;border:6px solid var(--gold);background:#fff;box-shadow:0 0 30px rgba(255,210,63,.6)}
.tap{font-family:var(--round);font-weight:900;font-size:clamp(20px,4vw,28px);color:#3a2600;background:linear-gradient(#ffe680,#ffc21a);border-radius:999px;padding:12px 36px;box-shadow:0 6px 0 #b37a00;animation:pulse 1.3s ease-in-out infinite}

/* ===== タイトル（チームづくり） ===== */
.hd{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.hd img{width:clamp(76px,12vw,110px);border-radius:50%;border:5px solid var(--gold);background:#fff}
.hd .en{font-weight:900;letter-spacing:.3em;color:var(--cyan);font-size:13px}
.hd h1{margin:2px 0 0;font-family:var(--round);font-weight:900;font-size:clamp(26px,5vw,44px);line-height:1.15;text-shadow:0 0 12px rgba(255,210,63,.6),0 4px 0 #c27b00}
.hd p{margin:4px 0 0;color:var(--sub);font-weight:700}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.box{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 14px}
.box h3{margin:0 0 8px;font-family:var(--round);font-size:17px;color:var(--gold)}
.box input[type=text]{width:100%;font-size:20px;font-weight:900;padding:8px 12px;border-radius:12px;border:3px solid var(--gold);background:#fff;color:#141a46}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:3em;font-weight:900;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff}
.seg button.on{background:linear-gradient(#ffe680,#ffc21a);color:#3a2600;border-color:#ffe680;box-shadow:0 3px 0 #b37a00}
.members{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sw{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:700;color:var(--sub)}
.sw input{width:22px;height:22px;accent-color:#ffc21a}
.go-main{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 16px}
.go-main .big{font-size:clamp(22px,3.4vw,28px);padding:14px 40px}
.go-main .hs{font-weight:900;color:var(--gold)}
.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--sub);font-weight:700;font-size:14px}
.flow b{color:#fff;background:rgba(255,255,255,.1);border-radius:999px;padding:2px 12px}
.prac{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.06);color:#fff;transition:transform .12s,border-color .12s}
.pc:hover{transform:translateY(-2px);border-color:var(--gold)}
.pc .no{font-weight:900;color:var(--cyan);letter-spacing:.15em;font-size:13px}
.pc .nm{font-family:var(--round);font-weight:900;font-size:19px}
.pc .ds{font-size:13px;color:var(--sub);line-height:1.6}
.sect{margin:6px 0 10px;font-family:var(--round);font-weight:900;color:var(--gold);font-size:17px}

/* ===== ステージのとびら ===== */
.intro{text-align:center;padding:24px 10px}
.intro .stg{display:inline-block;font-weight:900;letter-spacing:.3em;color:var(--cyan);font-size:clamp(18px,3vw,24px);animation:slidein .5s both}
.intro h2{margin:6px 0 10px;font-family:var(--round);font-weight:900;font-size:clamp(34px,7vw,64px);text-shadow:0 0 18px rgba(255,210,63,.7),0 5px 0 #c27b00;animation:zoomin .6s .15s both}
.intro .rule{max-width:640px;margin:0 auto 18px;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 18px;line-height:1.9;font-weight:700;text-align:left}
.intro .rule li{margin:2px 0}
@keyframes slidein{from{transform:translateX(-60px);opacity:0}}
@keyframes zoomin{from{transform:scale(2.2);opacity:0}}

/* ===== ステージの頭 ===== */
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh .t{font-family:var(--round);font-weight:900;font-size:19px;color:var(--gold)}
.sh .sp{flex:1}
.sh .sc{font-weight:900;font-size:20px;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 14px}
.sh .lv{display:flex;gap:4px}
.qbox{background:#fff;color:#141a46;border-radius:16px;padding:14px 18px;font-weight:900;font-size:clamp(19px,2.8vw,25px);line-height:1.6;box-shadow:0 6px 0 rgba(0,0,0,.25);margin-bottom:12px}
.qbox small{display:block;font-size:13px;color:#5a64a8;margin-bottom:2px}
.turn{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 12px;font-family:var(--round);font-weight:900;font-size:clamp(20px,3.2vw,28px)}
.turn .mb{font-size:clamp(20px,3.2vw,28px);animation:pulse 1.2s infinite}

/* トロッコ */
.track{position:relative;height:clamp(260px,40vw,380px);border-radius:18px;overflow:hidden;background:linear-gradient(#2c3a8c 0%,#5a4fb0 45%,#7c5b3a 46%,#4e3622 100%)}
.track svg.rails{position:absolute;inset:0;width:100%;height:100%}
.sign{position:absolute;top:8%;width:44%;min-height:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;border-radius:14px;border:4px solid #3a2600;background:linear-gradient(#fff3c4,#ffd96a);color:#3a2600;font-weight:900;font-size:clamp(16px,2.6vw,24px);line-height:1.4;text-align:center;box-shadow:0 8px 0 #7a4f00;transition:transform .12s}
.sign:hover:not(:disabled){transform:translateY(-3px) scale(1.02)}
.sign .ab{display:inline-flex;align-items:center;justify-content:center;width:1.8em;height:1.8em;border-radius:50%;background:#3a2600;color:#ffd96a;font-size:.9em}
.sign.l{left:3%}.sign.r{right:3%}
.sign.ok{background:linear-gradient(#c9ffd9,#5fe39a);border-color:#0f5f33}
.sign.bad{background:linear-gradient(#ffd3d3,#ff8a8a);border-color:#7a1010;animation:shake .4s}
.cart{position:absolute;left:50%;bottom:4%;width:clamp(90px,15vw,130px);margin-left:calc(clamp(90px,15vw,130px) / -2);transition:transform 1s cubic-bezier(.4,.1,.6,1)}
.cart.fall{transition:transform .9s ease-in}
.cart img{position:absolute;left:18%;bottom:46%;width:64%;border-radius:50%;background:#fff;border:3px solid #3a2600}
.cart .body{position:relative;margin-top:44%;height:46%;}
.lives{display:flex;gap:4px}
.life{width:26px;height:22px}
.prog{display:flex;gap:6px;align-items:center}
.prog i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35)}
.prog i.ok{background:var(--ok);border-color:#bfffd9}.prog i.ng{background:var(--ng);border-color:#ffd0d0}.prog i.now{background:var(--gold);border-color:#fff;animation:pulse 1s infinite}

/* パーフェクトリレー */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.chips .mb{opacity:.45}
.chips .mb.now{opacity:1;transform:scale(1.15);box-shadow:0 0 0 3px #fff}
.chips .mb.ok{opacity:1;outline:3px solid var(--ok)}
.chips .mb.ng{opacity:1;outline:3px solid var(--ng)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:clamp(17px,2.4vw,22px);line-height:1.4;background:#fff;color:#141a46;box-shadow:0 6px 0 #9aa3e0;transition:transform .1s}
.opt .k{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;border-radius:50%;color:#fff;font-size:.9em}
.opt:nth-child(1) .k{background:var(--m1)}.opt:nth-child(2) .k{background:var(--m2)}.opt:nth-child(3) .k{background:var(--m3)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt.ok{background:#d8ffe7;box-shadow:0 0 0 4px var(--ok),0 6px 0 #1f8a4f}
.opt.ng{background:#ffdede;box-shadow:0 0 0 4px var(--ng),0 6px 0 #a33;animation:shake .4s}
.opt:disabled{cursor:default}
@media (max-width:720px){ .opts{grid-template-columns:1fr} }

/* 1文字リレー */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot .ch{display:flex;align-items:center;justify-content:center;width:clamp(56px,10vw,86px);height:clamp(56px,10vw,86px);border-radius:14px;background:#fff;color:#141a46;font-weight:900;font-size:clamp(32px,6vw,54px);box-shadow:0 6px 0 #9aa3e0;transition:transform .3s}
.slot .ch.now{box-shadow:0 0 0 5px var(--gold),0 6px 0 #9aa3e0;animation:pulse 1s infinite}
.slot .ch.hide{background:linear-gradient(#4a55b8,#2d3584);color:#fff}
.slot .ch.ok{background:#d8ffe7;box-shadow:0 0 0 5px var(--ok),0 6px 0 #1f8a4f}
.slot .ch.ng{background:#ffdede;box-shadow:0 0 0 5px var(--ng),0 6px 0 #a33}
.slot .ch.flip{animation:flip .45s}
@keyframes flip{50%{transform:rotateY(90deg)}}
.slot .fix{font-weight:900;color:var(--ok);font-size:18px;min-height:1.3em}
.cands{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:640px;margin:0 auto}
.cand{border:0;border-radius:14px;background:#fff;color:#141a46;font-weight:900;font-size:clamp(30px,5vw,44px);padding:10px 0;box-shadow:0 6px 0 #9aa3e0;transition:transform .1s}
.cand:hover{transform:translateY(-3px);background:#fff6c8}
@media (max-width:720px){ .cands{grid-template-columns:repeat(3,1fr)} }
.cover{text-align:center;padding:18px 10px;background:rgba(0,0,0,.25);border-radius:16px}
.cover .who{font-family:var(--round);font-weight:900;font-size:clamp(22px,4vw,34px);margin-bottom:6px}
.cover p{margin:0 0 14px;color:var(--sub);font-weight:700}
.answerline{text-align:center;font-weight:900;font-size:clamp(18px,2.6vw,22px);margin-top:10px}
.answerline b{color:var(--gold);font-size:1.3em}
.nav{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}

/* 演出 */
.flash{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(#fff,#ffe27a 45%,rgba(255,200,60,0) 70%);animation:flash .5s ease-out forwards}
@keyframes flash{to{transform:scale(9);opacity:0}}
.spark{position:absolute;font-size:24px;color:#ffe066;text-shadow:0 0 8px #fff;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(160deg);opacity:0}}
.word{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;animation:pop 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.word .w{display:block;font-family:var(--round);font-weight:900;font-size:clamp(44px,9vw,90px);line-height:1;color:#fff;-webkit-text-stroke:5px #c27b00;paint-order:stroke fill;text-shadow:0 0 20px rgba(255,210,63,.9),0 6px 0 #7a4f00}
.word.ng .w{-webkit-text-stroke-color:#a31d1d;text-shadow:0 6px 0 #5c0d0d}
.word .s{display:inline-block;margin-top:8px;font-weight:900;font-size:clamp(17px,3vw,24px);color:#3a2600;background:var(--gold);border-radius:999px;padding:2px 16px}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-70%);opacity:0}}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}


/* ===== 記録のほぞん ===== */
.recbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.recbar-lb{font-family:var(--round);font-weight:900;color:var(--gold);margin-right:4px}
.sv-h{margin:0 0 6px;font-family:var(--round);font-weight:900;font-size:clamp(24px,4vw,34px);color:var(--gold)}
.sv-lead{margin:0 0 14px;line-height:1.8;font-weight:700;color:#e6e9ff}
.sv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;align-items:start}
.sv-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:14px;text-align:center}
.sv-card h3{margin:0 0 10px;font-family:var(--round);font-weight:900;font-size:20px;color:#fff;display:flex;align-items:center;gap:8px;justify-content:center}
.sv-card .no{display:inline-block;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3a2600;line-height:28px;font-size:16px}
.sv-img{display:block;width:min(260px,100%);margin:0 auto 10px;border:2px solid var(--gold);box-shadow:0 6px 12px rgba(0,0,0,.35);background:#fff}
.sv-code{font-weight:700;margin-bottom:12px}
.sv-code b{display:block;font-family:"Courier New",monospace;font-size:clamp(17px,2.6vw,22px);color:var(--gold);word-break:break-all}
.sv-tip{font-size:13px;color:var(--sub);line-height:1.6;margin:10px 0 0;text-align:left}
.sv-file{display:inline-block;cursor:pointer}
.sv-or{margin:16px 0 8px;font-weight:700;color:var(--sub)}
.sv-input{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sv-input input{flex:1;min-width:0;max-width:330px;font-family:"Courier New",monospace;font-size:18px;font-weight:700;padding:8px 10px;border:3px solid var(--gold);border-radius:10px;background:#fff;color:#141a46;text-transform:uppercase}
.sv-input .big{padding:8px 20px;font-size:18px}
.sv-msg{margin-top:12px;min-height:1.5em;font-weight:700;line-height:1.6}
.sv-msg.ok{color:var(--ok)}.sv-msg.ng{color:var(--ng)}

/* ===== 結果 ===== */
.res{text-align:center}
.res .ttl{font-weight:900;letter-spacing:.3em;color:var(--cyan)}
.res h2{margin:4px 0 6px;font-family:var(--round);font-weight:900;font-size:clamp(28px,5.4vw,46px);text-shadow:0 0 14px rgba(255,210,63,.7),0 4px 0 #c27b00}
.res-main{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.res-l{position:relative}
.res-l img{width:clamp(140px,22vw,190px);border-radius:50%;border:6px solid var(--gold);background:#fff}
.stamp{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%) rotate(-10deg);white-space:nowrap;font-family:var(--round);font-weight:900;font-size:clamp(17px,2.8vw,22px);color:#ff4f4f;border:4px double #ff4f4f;border-radius:10px;padding:2px 12px;background:rgba(255,255,255,.95);animation:stamp .45s 1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:translateX(-50%) rotate(-10deg) scale(3);opacity:0}to{transform:translateX(-50%) rotate(-10deg) scale(1);opacity:1}}
.res-r{min-width:260px;max-width:440px;flex:1}
.stars{font-size:clamp(40px,8vw,58px);letter-spacing:6px;color:var(--gold);text-shadow:0 0 12px rgba(255,210,63,.8)}
.stars .off{color:rgba(255,255,255,.18);text-shadow:none}
.tot{font-family:var(--round);font-weight:900;line-height:1}
.tot .num{font-size:clamp(64px,13vw,104px);color:#fff;text-shadow:0 0 16px rgba(255,210,63,.8),0 5px 0 #c27b00}
.tot .u{font-size:28px;margin-left:4px}
.rows{margin-top:10px;text-align:left}
.rows div{display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-bottom:2px dotted rgba(255,255,255,.25);font-weight:700}
.rows div::after{content:"";order:1;flex:1}
.rows dd{order:2;margin:0;font-weight:900;font-size:19px;color:var(--gold);white-space:nowrap}
.rows dt small{display:block;font-weight:700}
.rows dt{color:#fff}
.newrec{display:inline-block;margin-top:12px;font-family:var(--round);font-weight:900;font-size:19px;color:#fff;background:linear-gradient(#ff7aa8,#ff3d7f);border-radius:999px;padding:4px 20px;animation:pulse 1.1s infinite}

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---- 設定と記録 ---- */
const cfg = {n: 4, subj: "ぜんぶ"};
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }catch(e){ return {}; } }
function store(d){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(d)); }catch(e){} }
function best(id){ return (load().best || {})[id] || 0; }
function saveBest(id, v){ const d = load(); d.best = d.best || {}; const old = d.best[id] || 0; if (v > old){ d.best[id] = v; store(d); } return {old, isNew: v > old && v > 0}; }

/* ---- 音（ファイルなし） ---- */
let soundOn = false, actx = null;
function tone(notes, type, gap, len){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * (gap || .12), L = len || .22;
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.13, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + L);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + L + .02);
    });
  }catch(e){}
}
const snd = {ok: () => tone([988, 784], "sine", .16, .35), ng: () => tone([180, 150], "square", .18, .35), tick: () => tone([660], "triangle", .1, .08),
  fan: () => tone([523, 659, 784, 1047, 784, 1047], "triangle", .12, .25), roll: () => tone(Array(10).fill(0).map((_, i) => 300 + i * 20), "square", .07, .05), crash: () => tone([200, 140, 90], "sawtooth", .1, .25)};
$("sndBtn").onclick = () => { soundOn = !soundOn; $("sndBtn").textContent = soundOn ? "音 ON" : "音 OFF"; snd.tick(); };

/* ---- 演出 ---- */
let fxT = [];
function clearFx(){ fxT.forEach(clearTimeout); fxT = []; $("fx").innerHTML = ""; }
function at(el){ const b = $("cv-box").getBoundingClientRect(), r = el.getBoundingClientRect(); return {x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2, w: b.width, h: b.height}; }
function addFx(cls, html, x, y, css){ const d = document.createElement("div"); d.className = cls; d.innerHTML = html || ""; d.style.left = x + "px"; d.style.top = y + "px"; if (css) d.style.cssText += css; $("fx").appendChild(d); return d; }
function bigWord(el, text, sub, ng){
  clearFx(); const p = at(el);
  if (!ng){ addFx("flash", "", p.x, p.y); for (let i = 0; i < 14; i++){ const a = i / 14 * Math.PI * 2, R = 80 + Math.random() * 60; addFx("spark", "★", p.x, p.y, `--dx:${Math.cos(a) * R}px;--dy:${Math.sin(a) * R}px`); } }
  addFx("word" + (ng ? " ng" : ""), `<span class="w">${text}</span>${sub ? `<span class="s">${sub}</span>` : ""}`, Math.min(Math.max(p.x, 180), p.w - 180), Math.max(p.y - 30, 90));
  fxT.push(setTimeout(() => { $("fx").innerHTML = ""; }, 1500));
}
function confetti(){
  const box = $("cv-box").getBoundingClientRect(), cols = ["#ff5a5a", "#3d9bff", "#35c56f", "#ffb020", "#b06bff", "#ff7ac6", "#ffe066"];
  for (let i = 0; i < 70; i++) addFx("confetti", "", Math.random() * box.width, -20, `background:${cols[i % 7]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .6}s`);
  fxT.push(setTimeout(() => { $("fx").innerHTML = ""; }, 3600));
}

/* ---- 画面の切りかえ ---- */
let game = null, adv = null;
function show(id){
  clearFx(); clearTimeout(adv);
  ["cushion","home","intro","trolley","relay","moji","result","save"].forEach(s => $(s).hidden = (s !== id));
  $("topbar").hidden = (id === "cushion");

/* ---- タイトル（チームづくり） ---- */
function home(){
  $("segN").innerHTML = [2, 3, 4, 5, 6].map(n => `<button type="button" data-n="${n}" class="${n === cfg.n ? "on" : ""}">${n}人</button>`).join("");
  $("segN").querySelectorAll("button").forEach(b => b.onclick = () => { cfg.n = +b.dataset.n; home(); });
  $("memPreview").innerHTML = Array.from({length: cfg.n}, (_, i) => mb(i)).join("");
  $("segS").innerHTML = SUBJ.map(s => `<button type="button" data-s="${s}" class="${s === cfg.subj ? "on" : ""}">${s}</button>`).join("");
  $("segS").querySelectorAll("button").forEach(b => b.onclick = () => { cfg.subj = b.dataset.s; home(); });
  $("hsAll").textContent = best("all") ? `チームのハイスコア ${best("all")}点` : "";
  $("prac").innerHTML = STAGES.map(s => `<button class="pc" type="button" data-s="${s.id}"><span class="no">STAGE ${s.no}</span><span class="nm">${s.name}</span><span class="ds">${s.ds}</span></button>`).join("");
  $("prac").querySelectorAll(".pc").forEach(b => b.onclick = () => begin([b.dataset.s]));
  show("home");
}
$("goAll").onclick = () => begin(["trolley", "relay", "moji"]);

function pool(kind){
  const all = DATA[kind];
  const f = cfg.subj === "ぜんぶ" ? all : all.filter(q => q.s === cfg.subj);
  return shuffle(f.length >= 12 ? f : f.concat(shuffle(all.filter(q => !f.includes(q)))));
}
function begin(list){
  game = {list, idx: 0, team: ($("teamName").value || "").trim() || "はなまるチーム", n: cfg.n, scores: {}, notes: {}, review: [], choice: pool("choice"), relay: pool("relay")};
  intro();
}
function intro(){
  const st = STAGES.find(s => s.id === game.list[game.idx]);
  $("intro").innerHTML = `<div class="stg">STAGE ${st.no}</div><h2>${st.name}</h2>
    <ol class="rule">${st.rule.map(r => `<li>${r}</li>`).join("")}</ol>
    <button class="big" type="button" id="stgGo">スタート！</button>`;
  $("stgGo").onclick = () => ({trolley: trolley, relay: relay, moji: moji})[st.id]();
  show("intro"); snd.fan();
}
function nextStage(score, note){
  const id = game.list[game.idx]; game.scores[id] = score; game.notes[id] = note;
  game.idx++;
  if (game.idx < game.list.length) intro(); else result();
}
const takeChoice = () => { if (!game.choice.length) game.choice = pool("choice"); return game.choice.pop(); };

/* ======== STAGE 1 トロッコ ======== */
function heart(on){ return `<svg class="life" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21s-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12z" fill="${on ? "#ff5a7a" : "rgba(255,255,255,.18)"}" stroke="#fff" stroke-width="1.5"/></svg>`; }
function trolley(){
  const t = {i: 0, lives: LIVES, score: 0, res: []};
  game.t = t; show("trolley"); fork();
}
function fork(){
  const t = game.t, q = takeChoice(), wrong = q.d[Math.floor(Math.random() * q.d.length)], right = Math.random() < .5;
  t.q = q; t.okSide = right ? "r" : "l";
  const L = right ? wrong : q.a, R = right ? q.a : wrong;
  $("trolley").innerHTML = `
    <div class="sh"><span class="t">STAGE ${STAGES[0].no}　${STAGES[0].name}</span><span class="sp"></span>
      <span class="prog">${Array.from({length: FORKS}, (_, k) => `<i class="${t.res[k] === true ? "ok" : t.res[k] === false ? "ng" : k === t.i ? "now" : ""}"></i>`).join("")}</span>
      <span class="lives">${Array.from({length: LIVES}, (_, k) => heart(k < t.lives)).join("")}</span><span class="sc">${t.score}点</span></div>
    <div class="qbox"><small>分かれ道 ${t.i + 1} / ${FORKS}　（${esc(q.s)}）</small>${esc(q.q)}</div>
    <div class="track" id="track">
      <svg class="rails" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M44 100 L47 70 L22 38 M56 100 L53 70 L32 38 M47 70 L68 38 M53 70 L78 38" stroke="#d8c3a0" stroke-width="1.6" fill="none" vector-effect="non-scaling-stroke"/>
        ${[96, 88, 80, 73].map((y, k) => `<path d="M${42 + k * 0.6} ${y} H${58 - k * 0.6}" stroke="#8a6440" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`).join("")}
      </svg>
      <button class="sign l" type="button" data-side="l"><span class="ab">A</span>${esc(L)}</button>
      <button class="sign r" type="button" data-side="r"><span class="ab">B</span>${esc(R)}</button>
      <div class="cart" id="cart"><img alt="" src="${IMG.cart}"><svg class="body" viewBox="0 0 120 60" width="100%" aria-hidden="true"><rect x="4" y="4" width="112" height="38" rx="6" fill="#b5642a" stroke="#3a2600" stroke-width="4"/><path d="M4 18h112" stroke="#3a2600" stroke-width="3"/><circle cx="30" cy="48" r="10" fill="#3a3a3a" stroke="#ddd" stroke-width="3"/><circle cx="90" cy="48" r="10" fill="#3a3a3a" stroke="#ddd" stroke-width="3"/></svg></div>
    </div>
    <div class="answerline" id="tMsg">みんなで 相談して、A か B の かんばんを おそう！</div>
    <div class="nav" id="tNav"></div>`;
  $("trolley").querySelectorAll(".sign").forEach(b => b.onclick = () => pickFork(b.dataset.side, b));
}
function pickFork(side, el){
  const t = game.t; if (t.busy) return; t.busy = true;
  $("trolley").querySelectorAll(".sign").forEach(b => b.disabled = true);
  const cart = $("cart"), trk = $("track"), dx = (side === "l" ? -1 : 1) * trk.clientWidth * .27, dy = -trk.clientHeight * .42;
  cart.style.transform = `translate(${dx}px,${dy}px) scale(.62)`;
  snd.roll();
  setTimeout(() => {
    const ok = side === t.okSide;
    t.res[t.i] = ok;
    if (ok){
      el.classList.add("ok"); t.score += 10; snd.ok(); bigWord(el, "せいかい！", "+10点");
      $("tMsg").innerHTML = `正かいは「<b>${esc(t.q.a)}</b>」！ そのまま すすめ！`;
    } else {
      el.classList.add("bad"); t.lives--; snd.crash();
      cart.classList.add("fall"); cart.style.transform = `translate(${dx * 1.2}px,${dy + trk.clientHeight * .8}px) rotate(${side === "l" ? -120 : 120}deg) scale(.5)`;
      bigWord(el, "ガタン！", t.lives > 0 ? "ハートが へった…" : "トロッコが こわれた…", true);
      $("tMsg").innerHTML = `正かいは「<b>${esc(t.q.a)}</b>」だったよ。`;
      game.review.push({stage: "トロッコ", q: t.q.q, a: t.q.a});
    }
    t.i++; t.busy = false;
    const end = t.i >= FORKS || t.lives <= 0;
    $("tNav").innerHTML = `<button class="big" type="button" id="tNext">${end ? (t.lives > 0 ? "ゴールへ ▶" : "けっかへ ▶") : "つぎの 分かれ道へ ▶"}</button>`;
    $("tNext").onclick = () => end ? trolleyEnd() : fork();
  }, 1050);
}
function trolleyEnd(){
  const t = game.t, goal = t.lives > 0;
  if (goal) t.score += 20;
  stageClear(goal ? "ゴール！" : "ざんねん…", goal ? `ゴールボーナス +20点　合計 ${t.score}点` : `${t.res.filter(Boolean).length}つの 分かれ道を こえたよ。${t.score}点`, goal, () => nextStage(t.score, goal ? `ゴール（ハート ${t.lives}こ のこり）` : `${t.res.filter(Boolean).length} / ${FORKS} で ストップ`));
}

/* ======== STAGE 2 パーフェクトリレー ======== */
function relay(){
  const qs = Array.from({length: game.n}, () => takeChoice());
  game.r = {qs, i: 0, ok: 0, res: [], score: 0};
  show("relay"); relayQ();
}
function relayQ(){
  const r = game.r, q = r.qs[r.i], opts = shuffle([q.a].concat(q.d));
  $("relay").innerHTML = `
    <div class="sh"><span class="t">STAGE ${STAGES[1].no}　${STAGES[1].name}</span><span class="sp"></span><span class="sc">${r.score}点</span></div>
    <div class="chips">${Array.from({length: game.n}, (_, k) => `<span class="mb m${k % 6 + 1}${k === r.i ? " now" : ""}${r.res[k] === true ? " ok" : r.res[k] === false ? " ng" : ""}">${k + 1}ばん</span>`).join("")}</div>
    <div class="turn">${mb(r.i)} の人の 番！</div>
    <div class="qbox"><small>${r.i + 1} / ${game.n}問　（${esc(q.s)}）</small>${esc(q.q)}</div>
    <div class="opts">${opts.map(o => `<button class="opt" type="button" data-v="${esc(o)}"><span class="k">${"ABC"[opts.indexOf(o)]}</span>${esc(o)}</button>`).join("")}</div>
    <div class="answerline" id="rMsg"></div><div class="nav" id="rNav"></div>`;
  $("relay").querySelectorAll(".opt").forEach(b => b.onclick = () => relayPick(b));
}
function relayPick(el){
  const r = game.r, q = r.qs[r.i], ok = el.dataset.v === q.a;
  $("relay").querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b.dataset.v === q.a) b.classList.add("ok"); });
  r.res[r.i] = ok;
  if (ok){ r.ok++; r.score += 10; snd.ok(); bigWord(el, "せいかい！", "+10点"); $("rMsg").innerHTML = "ナイス！ つぎの人に バトンタッチ！"; }
  else { el.classList.add("ng"); snd.ng(); bigWord(el, "ざんねん", "", true); $("rMsg").innerHTML = `正かいは「<b>${esc(q.a)}</b>」。どんまい！`; game.review.push({stage: "パーフェクトリレー", q: q.q, a: q.a}); }
  r.i++;
  const end = r.i >= game.n;
  $("rNav").innerHTML = `<button class="big" type="button" id="rNext">${end ? "けっか はっぴょう ▶" : `${mb(r.i)} の人へ ▶`}</button>`;
  $("rNext").onclick = () => end ? relayEnd() : relayQ();
}
function relayEnd(){
  const r = game.r, perfect = r.ok === game.n;
  if (perfect) r.score += 30;
  stageClear(perfect ? "パーフェクト！" : `${r.ok} / ${game.n}人 正かい`, perfect ? `パーフェクト ボーナス +30点　合計 ${r.score}点` : `あと ${game.n - r.ok}人で パーフェクトだった！　${r.score}点`, perfect, () => nextStage(r.score, perfect ? "パーフェクト！" : `${r.ok} / ${game.n}人 正かい`));
}

/* ======== STAGE 3 1文字リレー ======== */
const HIRA = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょ".split("");
const KATA = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポァィゥェォッャュョー".split("");
const KANJI = [...new Set(DATA.relay.concat(DATA.choice).map(q => q.a + q.q).join("").split("").filter(c => /[一-鿿]/.test(c)))];
const LOOK = {"ぬ":"め","め":"ぬ","わ":"ね","ね":"れ","れ":"わ","さ":"ち","ち":"さ","る":"ろ","ろ":"る","は":"ほ","ほ":"ま","ま":"も","い":"り","り":"い","う":"つ","つ":"う","し":"つ","く":"へ","き":"さ","こ":"に","に":"た","た":"に","あ":"お","お":"あ","ょ":"よ","よ":"ょ","ゅ":"ゆ","ゆ":"ゅ","ゃ":"や","や":"ゃ","っ":"つ","ば":"ぱ","ぱ":"ば","び":"ぴ","ぴ":"び","ぶ":"ぷ","ぷ":"ぶ","べ":"ぺ","ぺ":"べ","ぼ":"ぽ","ぽ":"ぼ"};
function candidates(ch){
  let src = /[ぁ-ゖ]/.test(ch) ? HIRA : /[ァ-ー]/.test(ch) ? KATA : KANJI;
  const out = new Set([ch]);
  if (LOOK[ch]) out.add(LOOK[ch]);
  const dk = ch.normalize("NFD")[0]; if (dk !== ch && /[ぁ-ヿ]/.test(dk)) out.add(dk);
  const base = HIRA.find(h => h.normalize("NFD")[0] === ch && h !== ch); if (base) out.add(base);
  for (const c of shuffle(src)){ if (out.size >= 6) break; out.add(c); }
  return shuffle([...out]);
}
function moji(){
  const words = [];
  while (words.length < MOJI_WORDS){ if (!game.relay.length) game.relay = pool("relay"); words.push(game.relay.pop()); }
  game.m = {words, w: 0, score: 0, clears: 0, secret: $("secret").checked};
  show("moji"); mojiWord();
}
function mojiWord(){
  const m = game.m, q = m.words[m.w];
  m.chars = Array.from(q.a); m.pick = []; m.k = 0;
  mojiPaint();
}
function mojiPaint(phase){
  const m = game.m, q = m.words[m.w], who = m.k % game.n;
  const done = m.k >= m.chars.length;
  const slots = m.chars.map((c, i) => {
    const owner = i % game.n, v = m.pick[i];
    let cls = "ch", txt = "";
    if (phase === "reveal"){ cls += " " + (v === c ? "ok" : "ng") + " flip"; txt = v; }
    else if (v !== undefined){ if (m.secret){ cls += " hide"; txt = "？"; } else txt = v; }
    else if (i === m.k) cls += " now";
    return `<div class="slot"><div class="${cls}" data-i="${i}">${esc(txt)}</div>${mb(owner)}<div class="fix">${phase === "reveal" && v !== c ? esc(c) : ""}</div></div>`;
  }).join("");
  let body = "";
  if (phase === "reveal") body = "";
  else if (done) body = `<div class="cover"><div class="who">全員 えらび おわったよ！</div><p>みんなで 画面を 見て、答え合わせを しよう。</p><button class="big" type="button" id="mOpen">答え合わせ！</button></div>`;
  else if (m.secret && phase !== "pick") body = `<div class="cover"><div class="who">${mb(who)} の人、画面の前へ！</div><p>${m.k + 1}文字目を えらぶよ。ほかの人は 見ないでね。</p><button class="big" type="button" id="mSee">見る</button></div>`;
  else body = `<div class="turn">${mb(who)} の人が、${m.k + 1}文字目を えらぼう！</div><div class="cands">${candidates(m.chars[m.k]).map(c => `<button class="cand" type="button" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  $("moji").innerHTML = `
    <div class="sh"><span class="t">STAGE ${STAGES[2].no}　${STAGES[2].name}</span><span class="sp"></span><span>${m.w + 1} / ${m.words.length}問目</span><span class="sc">${m.score}点</span></div>
    <div class="qbox"><small>答えは ${m.chars.length}文字　（${esc(q.s)}）</small>${esc(q.q)}</div>
    <div class="slots" id="mSlots">${slots}</div>${body}
    <div class="answerline" id="mMsg"></div><div class="nav" id="mNav"></div>`;
  if ($("mSee")) $("mSee").onclick = () => mojiPaint("pick");
  if ($("mOpen")) $("mOpen").onclick = mojiReveal;
  $("moji").querySelectorAll(".cand").forEach(b => b.onclick = () => { m.pick[m.k] = b.dataset.c; m.k++; snd.tick(); mojiPaint(); });
}
function mojiReveal(){
  const m = game.m, q = m.words[m.w];
  mojiPaint("hidden-all");
  const chEls = () => $("mSlots").querySelectorAll(".ch");
  chEls().forEach(e => { e.classList.remove("now"); e.classList.add("hide"); e.textContent = "？"; });
  $("moji").querySelector(".cover, .turn") && $("moji").querySelector(".cover, .turn").remove();
  let i = 0, nOk = 0;
  (function step(){
    if (i >= m.chars.length){
      const all = nOk === m.chars.length, pts = nOk * 5 + (all ? 20 : 0);
      m.score += pts; if (all) m.clears++;
      if (all){ snd.fan(); bigWord($("mSlots"), "クリア！", `+${pts}点`); confetti(); }
      else { snd.ng(); bigWord($("mSlots"), "おしい！", "", true); game.review.push({stage: "1文字リレー", q: q.q, a: q.a}); }
      $("mMsg").innerHTML = all ? `「<b>${esc(q.a)}</b>」 全員 正かい！` : `正しい答えは「<b>${esc(q.a)}</b>」。${nOk}文字 合っていたよ。`;
      const last = m.w + 1 >= m.words.length;
      $("mNav").innerHTML = `<button class="big" type="button" id="mNext">${last ? "けっか はっぴょう ▶" : "つぎの 問題へ ▶"}</button>`;
      $("mNext").onclick = () => { if (last) mojiEnd(); else { m.w++; mojiWord(); } };
      $("moji").querySelector(".sc").textContent = m.score + "点";
      return;
    }
    const e = chEls()[i], v = m.pick[i], ok = v === m.chars[i];
    e.classList.remove("hide"); e.classList.add("flip", ok ? "ok" : "ng"); e.textContent = v;
    if (!ok) e.parentElement.querySelector(".fix").textContent = m.chars[i];
    if (ok){ nOk++; tone([700 + i * 60], "sine", .1, .12); } else tone([200], "square", .1, .15);
    i++; adv = setTimeout(step, 650);
  })();
}
function mojiEnd(){
  const m = game.m, all = m.clears === m.words.length;
  if (all) m.score += 30;
  stageClear(all ? "パーフェクト クリア！" : `${m.clears} / ${m.words.length}問 クリア`, (all ? "全問 クリア ボーナス +30点　" : "") + `合計 ${m.score}点`, all, () => nextStage(m.score, `${m.clears} / ${m.words.length}問 クリア`));
}

/* ---- ステージのおわり ---- */
function stageClear(title, sub, good, next){
  const st = STAGES.find(s => s.id === game.list[game.idx]);
  $("intro").innerHTML = `<div class="stg">STAGE ${st.no}　${st.name}</div><h2>${title}</h2><p style="font-weight:900;font-size:20px">${sub}</p>
    <button class="big" type="button" id="stgNext">${game.idx + 1 < game.list.length ? "つぎの ステージへ ▶" : "さいごの けっか はっぴょう ▶"}</button>`;
  $("stgNext").onclick = next;
  show("intro");
  if (good){ snd.fan(); confetti(); } else snd.ng();
}

/* ---- 結果 ---- */
function result(){
  const total = Object.values(game.scores).reduce((a, b) => a + b, 0);
  const full = game.list.length === 3;
  const max = (game.list.includes("trolley") ? FORKS * 10 + 20 : 0) + (game.list.includes("relay") ? game.n * 10 + 30 : 0) + (game.list.includes("moji") ? 0 : 0);
  const mojiMax = game.list.includes("moji") ? game.m.words.reduce((s, w) => s + Array.from(w.a).length * 5 + 20, 0) + 30 : 0;
  const rate = total / (max + mojiMax);
  const stars = rate >= .85 ? 3 : rate >= .55 ? 2 : 1;
  const key = full ? "all" : game.list[0];
  const rec = saveBest(key, total);
  const rank = stars === 3 ? "チャンピオン" : stars === 2 ? "名コンビ" : "ナイスファイト";
  const rows = game.list.map(id => { const s = STAGES.find(x => x.id === id); return `<div><dt>STAGE ${s.no} ${s.name}　<small style="color:var(--sub)">${esc(game.notes[id] || "")}</small></dt><dd>${game.scores[id]}点</dd></div>`; }).join("");
  $("result").innerHTML = `
    <div class="ttl">RESULT</div><h2>${esc(game.team)}</h2>
    <div class="res-main">
      <div class="res-l"><img alt="" src="${IMG.win}"><div class="stamp">${rank}</div></div>
      <div class="res-r">
        <div class="stars">${starText(stars)}</div>
        <div class="tot"><span class="num" id="tNum">0</span><span class="u">点</span></div>
        <dl class="rows">${rows}<div><dt>ハイスコア</dt><dd>${Math.max(rec.old, total)}点</dd></div></dl>
      </div>
    </div>
    ${rec.isNew ? `<div class="newrec">${rec.old ? "ハイスコア こうしん！" : "はじめての記録！"}</div>` : ""}
    <div class="msg">${stars === 3 ? "すごい！ さいこうの チームワークだ！" : stars === 2 ? "いいチームワーク！ もう少しで チャンピオン！" : "ナイスファイト！ 作戦を 立てて、もう一度 ちょうせんしよう！"}</div>
    <div class="nav"><button class="big" type="button" id="again">もう一度</button><button class="big sub" type="button" id="toSave">記録を QRコードで ほぞん</button><button class="big sub" type="button" id="toHome">さいしょの画面</button></div>
    ${game.review.length ? `<div class="review"><h3>ふりかえり（まちがえた問題）</h3><ul>${game.review.map(r => `<li>${esc(r.q)} → <b>${esc(r.a)}</b> <small style="color:var(--sub)">（${r.stage}）</small></li>`).join("")}</ul></div>` : ""}`;
  $("again").onclick = () => begin(game.list); $("toHome").onclick = home; $("toSave").onclick = openSave;
  show("result"); snd.fan(); if (stars >= 2) confetti();
  const el = $("tNum"), t0 = performance.now();
  (function up(now){ const p = Math.min(1, (now - t0) / 1000); el.textContent = Math.round(total * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(up); })(t0);
}

/* ---- 記録のQRコード ---- */
const REC_IDS = ["all", "trolley", "relay", "moji"], REC_LAYOUT = [10, 7, 7, 8];
function openSave(){
  const team = (($("teamName") && $("teamName").value) || "").trim() || "はなまるチーム";
  QRKit.screen({el: $("save"), title: "はなまるチームチャレンジ", en: "TEAM CHALLENGE", prefix: "TC1", fileBase: "TeamChallenge_kiroku",
    colors: {bg1: "#232b6b", bg2: "#141a46", frame: "#ffd23f", title: "#ffd23f", sub: "#2fd6ff", ink: "#ffffff", date: "#ffe680"},
    sub2: () => "チーム：" + team,
    getCode: () => QRKit.encode(REC_IDS.map((id, i) => [best(id), REC_LAYOUT[i]]), 1),
    lines: () => [["3つのステージ", "", best("all") ? best("all") + "点" : "－"], ["トロッコ大ぼうけん", "", best("trolley") ? best("trolley") + "点" : "－"], ["パーフェクトリレー", "", best("relay") ? best("relay") + "点" : "－"], ["1文字リレー", "", best("moji") ? best("moji") + "点" : "－"]],
    restore: (str) => {
      const v = QRKit.decode(str, REC_LAYOUT, 1, "TC1");
      if (!v) return {ok: false, msg: "ふっかつコードが ちがうみたい。もう一度 たしかめてね。"};
      const names = {all: "3つのステージ", trolley: "トロッコ大ぼうけん", relay: "パーフェクトリレー", moji: "1文字リレー"}, up = [];
      REC_IDS.forEach((id, i) => { if (saveBest(id, v[i]).isNew) up.push(names[id]); });
      return {ok: true, msg: up.length ? `記録を もどしたよ！（${up.join("・")}）<br><small>このパソコンの記録より いいものだけ もどしたよ。</small>` : "記録を 読みこんだよ。このパソコンの記録のほうが いいか、同じだったよ。"};
    }});
  show("save");
}
document.querySelectorAll("[data-save]").forEach(b => b.onclick = openSave);

$("homeBtn").onclick = home;
show("cushion");

/* ===== Canvaサイト用のしかけ ===== */
(function(){
  const box = $("cv-box"), probe = $("cv-probe"), toast = $("cv-toast");
  function apply(r){
    if (!r || r.width < 160 || r.height < 160){ box.style.left = box.style.top = box.style.width = box.style.height = ""; return; }
    box.style.left = r.left + "px"; box.style.top = r.top + "px"; box.style.width = r.width + "px"; box.style.height = r.height + "px";
  }
  let io = null; const TH = Array.from({length:101}, (_, i) => i / 100);
  function observe(){
    if (!("IntersectionObserver" in window)) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(es => { const e = es[es.length - 1]; apply(e.isIntersecting ? e.intersectionRect : null); }, {threshold: TH});
    io.observe(probe);
  }
  observe();
  addEventListener("resize", observe);
  document.addEventListener("fullscreenchange", observe);
  document.addEventListener("webkitfullscreenchange", observe);
  const cushion = $("cushion");
  cushion.addEventListener("click", home);
  cushion.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); home(); } });
  let tt = null;
  function toastSay(m){ toast.textContent = m; toast.hidden = false; clearTimeout(tt); tt = setTimeout(() => toast.hidden = true, 6000); }
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  $("fsBtn").addEventListener("click", async () => {
    if (isFs()){ try{ await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); }catch(e){} return; }
    const el = document.documentElement;
    try{ if (el.requestFullscreen) await el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }catch(e){}
    setTimeout(() => { if (!isFs()) toastSay("全画面にならないときは、キーボードの F11 をおしてね（Chromebookは □ のキー）"); }, 500);
  });
  const paint = () => { $("fsBtn").textContent = isFs() ? "もどす" : "全画面"; };
  document.addEventListener("fullscreenchange", paint);
  document.addEventListener("webkitfullscreenchange", paint);
})();
</script>
