<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>まなびひろば</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ことばクラフトと同じ決まり：紙・すみ色の線2px・角14px・さわると浮いて影・余白は8の倍数。
   遊園地らしさは「空・旗・風船・テント・汽車」で出す。 */
:root{--paper:#fbf7f0;--ink:#2b2118;--mute:#8c7f70;--line:#d9cdbb;--white:#fff;--sky:#d6ecf8;--r:14px;
  --c1:#ef7457;--c2:#f2a516;--c3:#3fae7a;--c4:#2e93dd;--c5:#7b5cff;--c6:#e0559a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;color:var(--ink)}
body{font-family:"BIZ UDPGothic",sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;
  background:linear-gradient(var(--sky) 0, var(--paper) 420px) no-repeat, var(--paper);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.k{font-family:"Klee One",serif;font-weight:600}
.lift{border:2px solid var(--ink);border-radius:var(--r);background:var(--white);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s ease;box-shadow:0 0 0 var(--ink);cursor:pointer}
.lift:hover{transform:translateY(-4px);box-shadow:0 5px 0 var(--ink)}
.lift:active{transform:translateY(1px);box-shadow:0 0 0 var(--ink);transition-duration:.06s}
.lion img{display:block;height:100%;width:auto}

/* 旗のガーランド */
.flags{height:48px;position:relative;overflow:hidden}
.flags svg{position:absolute;left:0;top:0;width:100%;height:48px;transform-origin:50% 0;animation:flag 4s ease-in-out infinite}
@keyframes flag{0%,100%{transform:rotate(0)}50%{transform:rotate(.4deg) translateY(2px)}}

/* ゲート：風船の文字 */
.gate{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:24px;max-width:1100px;margin:0 auto;padding:8px 24px 0}
.gate .lion{height:132px;justify-self:end;animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%}
.gate .lion.r{justify-self:start;animation-delay:-1.6s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-4px)}}
.balloons{display:flex;gap:8px;justify-content:center;padding-top:8px}
.balloons span{position:relative;display:grid;place-items:center;width:72px;height:80px;border:2px solid var(--ink);border-radius:50% 50% 46% 46%;
  background:var(--bc);font-size:36px;color:var(--ink);animation:float 3s ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
.balloons span::before{content:"";position:absolute;left:14px;top:12px;width:12px;height:18px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(25deg)}
.balloons span::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:28px;background:var(--ink);transform-origin:top;transform:rotate(calc(var(--i) * 3deg - 9deg))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.welcome{text-align:center;margin:32px 0 0}
.bubble{display:inline-block;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:8px 24px;font-size:20px}

/* テント（エリア） */
main{max-width:1100px;margin:0 auto;padding:24px}
.tents{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tent{display:flex;flex-direction:column;overflow:hidden;padding:0;text-align:left;font:inherit;color:inherit}
.tent .roof{height:56px;border-bottom:2px solid var(--ink);position:relative;
  background:repeating-linear-gradient(90deg,var(--zc) 0 28px,var(--white) 28px 56px)}
.tent .roof::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
  background:radial-gradient(circle at 14px 0,var(--zc) 13px,transparent 14px) 0 0/56px 14px repeat-x,
             radial-gradient(circle at 42px 0,var(--white) 13px,transparent 14px) 0 0/56px 14px repeat-x}
.tent .body{padding:24px 24px 16px;display:flex;align-items:center;gap:16px}
.tent h2{margin:0;font-size:28px;line-height:1.3}
.tent h2 small{display:block;font-family:"BIZ UDPGothic",sans-serif;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.1em}
.tent .go{margin-left:auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;background:var(--zc);color:var(--white);flex:none}
.tent p{margin:0;padding:0 24px 24px;color:var(--mute)}

/* 汽車 */
.rail{margin-top:24px;position:relative;overflow:hidden;padding:8px 0 24px}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:16px;height:8px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
  background:repeating-linear-gradient(90deg,transparent 0 20px,var(--ink) 20px 24px)}
.train{display:flex;gap:16px;width:max-content;animation:run 40s linear infinite;align-items:flex-end}
.rail:hover .train{animation-play-state:paused}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.car{position:relative;display:block;width:208px;padding:8px 8px 16px;background:var(--cc);margin-bottom:12px}
.car img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--ink);border-radius:8px;background:var(--white)}
.car .nm{display:block;font-size:13px;font-weight:700;color:var(--ink);background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:0 8px;margin-top:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car::before,.car::after{content:"";position:absolute;bottom:-14px;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 6px var(--white),inset 0 0 0 8px var(--ink)}
.car::before{left:24px}.car::after{right:24px}
.engine{position:relative;width:150px;height:118px;margin-bottom:12px;flex:none}
.engine .cab{position:absolute;right:0;bottom:0;width:64px;height:100px;background:var(--c1);border:2px solid var(--ink);border-radius:10px 10px 4px 4px}
.engine .cab::before{content:"";position:absolute;left:12px;top:12px;width:36px;height:28px;background:var(--sky);border:2px solid var(--ink);border-radius:6px}
.engine .boiler{position:absolute;left:0;bottom:0;width:96px;height:64px;background:var(--c2);border:2px solid var(--ink);border-radius:32px 8px 4px 4px}
.engine .chimney{position:absolute;left:16px;bottom:62px;width:20px;height:28px;background:var(--ink);border-radius:4px 4px 0 0}
.engine .smoke{position:absolute;left:14px;bottom:96px;width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;background:var(--white);animation:puff 1.6s ease-out infinite}
.engine .smoke:nth-of-type(2){animation-delay:-.8s}
@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(28px,-30px) scale(1.4);opacity:0}}
.engine::before,.engine::after{content:"";position:absolute;bottom:-14px;width:28px;height:28px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 6px var(--white),inset 0 0 0 8px var(--ink)}
.engine::before{left:16px}.engine::after{right:16px}

/* エリアの中 */
.zonehead{display:flex;align-items:center;gap:16px;margin:8px 0 24px}
.zonehead .back{font:inherit;font-weight:700;padding:8px 16px}
.zonehead h2{margin:0;font-size:28px}
.zonehead .chip{width:16px;height:16px;border-radius:50%;background:var(--zc);border:2px solid var(--ink)}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.app{display:flex;flex-direction:column;overflow:hidden;color:inherit}
.app img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:2px solid var(--ink)}
.app .in{padding:16px 24px 24px;display:flex;flex-direction:column;gap:8px}
.app h3{margin:0;font-size:20px}
.app .tag{align-self:flex-start;font-size:13px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px}
.app p{margin:0;color:var(--mute)}
.app .play{margin-top:8px;font-weight:700}

@media (prefers-reduced-motion:reduce){
  .flags svg,.gate .lion,.balloons span,.engine .smoke{animation:none}
  .train{animation:none}
  .rail{overflow-x:auto}
}
@media (max-width:820px){
  .gate{grid-template-columns:1fr;gap:8px}
  .gate .lion{display:none}
  .balloons span{width:44px;height:50px;font-size:22px}
  .balloons span::before{left:8px;top:8px;width:8px;height:12px}
  .balloons span::after{height:18px}
  .welcome{margin-top:24px}
  .bubble{font-size:16px}
  .tents,.apps{grid-template-columns:1fr;gap:16px}
  .tent h2{font-size:20px}
  main{padding:16px}
}
</style>
</head>
<body>
<div class="flags" aria-hidden="true"><svg id="flags" preserveAspectRatio="none"></svg></div>
<div id="app"></div>

<script src="common/lions.js"></script>
<script>
const ZONES = [
  { key: "sansu", name: "さんすう", sub: "SANSU", color: "var(--c4)", text: "数や 図形の なぞを とこう" },
  { key: "kokugo", name: "こくご", sub: "KOKUGO", color: "var(--c1)", text: "ことばで 気持ちを つたえよう" },
  { key: "bouken", name: "ぼうけん", sub: "BOUKEN", color: "var(--c5)", text: "クエストに ちょうせんしよう" },
];
const APPS = [
  { zone: "sansu", name: "がい数の はんい", tag: "4年 算数", href: "gaisu/index.html", shot: "common/shots/gaisu.jpg",
    desc: "切り上げ・切り捨て・四捨五入で、その数に なる はんいを すうちょくせんで さがそう。" },
  { zone: "kokugo", name: "ことばクラフト", tag: "4年 国語", href: "kotoba-craft/index.html", shot: "common/shots/kotoba-craft.jpg",
    desc: "「たのしかったです」で おわる 文を、らいおんと いっしょに くわしく そだてよう。" },
  { zone: "bouken", name: "学びクエスト", tag: "ぼうけん", href: "https://sunny-lotus.github.io/manabiquest/", shot: "common/shots/manabiquest.jpg",
    desc: "あいことばを 入れて、ぼうけんに 出よう。" },
];
const BALLOON = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (id) => document.getElementById(id);
const zoneOf = (k) => ZONES.find((z) => z.key === k);

function drawFlags() {
  const w = Math.max(window.innerWidth, 400), n = Math.ceil(w / 48);
  const cols = ["#ef7457", "#f2a516", "#3fae7a", "#2e93dd", "#7b5cff", "#e0559a"];
  let s = `<path d="M0 6 Q ${w / 2} 22 ${w} 6" fill="none" stroke="#2b2118" stroke-width="2"/>`;
  for (let i = 0; i < n; i++) {
    const x = i * 48 + 8, t = (x + 16) / w, y = 6 + 16 * 4 * t * (1 - t);
    s += `<path d="M${x} ${y} L${x + 32} ${y} L${x + 16} ${y + 26} Z" fill="${cols[i % cols.length]}" stroke="#2b2118" stroke-width="2" stroke-linejoin="round"/>`;
  }
  $("flags").setAttribute("viewBox", `0 0 ${w} 48`);
  $("flags").innerHTML = s;
}

function vTop() {
  const title = [..."まなびひろば"].map((ch, i) => `<span aria-hidden="true" style="--i:${i};--bc:${BALLOON[i % BALLOON.length]}">${ch}</span>`).join("");
  // 汽車：アプリが少なくても 画面いっぱいに つながるように くりかえす
  let cars = [];
  while (cars.length < 8) cars = cars.concat(APPS);
  const carHTML = cars.map((a) => `<a class="car lift" href="${esc(a.href)}" style="--cc:${zoneOf(a.zone).color}" title="${esc(a.name)}">
      <img src="${esc(a.shot)}" alt=""><span class="nm">${esc(a.name)}</span></a>`).join("");
  const engine = `<div class="engine" aria-hidden="true"><span class="smoke"></span><span class="smoke"></span><div class="chimney"></div><div class="boiler"></div><div class="cab"></div></div>`;
  return `<header class="gate">
      <span class="lion">${Lions.svg("hana", "happy")}</span>
      <h1 class="balloons k" aria-label="まなびひろば">${title}</h1>
      <span class="lion r">${Lions.svg("niji", "normal")}</span>
    </header>
    <p class="welcome"><span class="bubble k">ようこそ！ どの エリアで あそぶ？</span></p>
    <main>
      <div class="tents">${ZONES.map((z) => {
        const n = APPS.filter((a) => a.zone === z.key).length;
        return `<button class="tent lift" style="--zc:${z.color}" onclick="location.hash='${z.key}'">
          <span class="roof"></span>
          <span class="body"><h2 class="k"><small>${z.sub}</small>${z.name} エリア</h2><span class="go">▶</span></span>
          <p>${z.text}（${n}こ）</p></button>`;
      }).join("")}</div>
    </main>
    <div class="rail" aria-label="アプリの 汽車"><div class="train">${engine}${carHTML}${engine}${carHTML}</div></div>`;
}

function vZone(z) {
  const apps = APPS.filter((a) => a.zone === z.key);
  return `<main>
    <div class="zonehead" style="--zc:${z.color}"><button class="back lift" onclick="location.hash=''">◀ ひろばに もどる</button>
      <span class="chip"></span><h2 class="k">${z.name} エリア</h2></div>
    <div class="apps">${apps.map((a) => `<a class="app lift" href="${esc(a.href)}">
      <img src="${esc(a.shot)}" alt="">
      <span class="in"><span class="tag">${esc(a.tag)}</span><h3 class="k">${esc(a.name)}</h3><p>${esc(a.desc)}</p><span class="play">あそぶ ▶</span></span></a>`).join("")}</div>
  </main>`;
}

function render() {
  const z = zoneOf(location.hash.slice(1));
  $("app").innerHTML = z ? vZone(z) : vTop();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
window.addEventListener("resize", drawFlags);
drawFlags();
render();
</script>
</body>
</html>
